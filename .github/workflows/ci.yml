name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # Security rails run first and gate everything else. Nothing is installed or
  # executed from the repo before these pass.
  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tripwire (worm markers)
        run: sh scripts/tripwire.sh

      - name: Forged commits (every commit in the range, merges included)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="$PUSH_AFTER"   # new branch or first push: check its whole history
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          sh scripts/forged-commits.sh "$range"

      - name: Install gitleaks (pinned + checksum)
        run: |
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Gitleaks canary (must catch a planted fake secret)
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          # Built at runtime so no token-shaped string ever sits in this repo.
          token="gh""p_$(head -c 4096 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$token" > "$canary/leak.env"
          if gitleaks dir "$canary" --no-banner --redact; then
            echo "::error::gitleaks did not catch the planted secret; the secret scan cannot be trusted."
            exit 1
          fi
          echo "canary caught, as expected"

      - name: Gitleaks (whole history)
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose

  check:
    needs: rails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - name: Build with zero env (demo mode)
        run: bun run build
      - name: Lint (warns, never gates)
        run: bun run lint || echo "::warning::lint reported problems"
