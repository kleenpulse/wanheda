name: Desktop

# Builds the Windows installer (SPEC T81, V75). Installers for the owner come
# only from here. A pull request that touches the desktop app or what it
# packages builds it as a check. A v* tag builds it and puts it in a DRAFT
# GitHub release; a person publishes it, nothing here does. Unsigned for now
# (V75), so no job has any secret beyond its own GITHUB_TOKEN.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "lib/security/**"
      - "next.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Nothing from the repo is installed or run before the tripwire passes.
  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tripwire (worm markers)
        run: sh scripts/tripwire.sh

  build:
    needs: rails
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # next build and electron-builder run on Node (desktop/scripts/build.ts).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --cwd desktop --frozen-lockfile --ignore-scripts
      - run: bun run desktop:typecheck

      # The pinned Electron, checked against the package's checksums (ADR-0014).
      - name: Fetch Electron
        run: bun desktop/scripts/fetch-electron.ts
      # --full: the whole zip, checked against its pinned sha256 as well (ADR-0014).
      - name: Fetch ffmpeg
        run: bun desktop/scripts/fetch-ffmpeg.ts --full

      # Builds in demo mode (every env name empty), stages, packs the NSIS
      # installer, checks the server folder and the fuses, writes SHA256SUMS.txt.
      - name: Build the installer
        run: bun desktop/scripts/build.ts

      - name: Smoke-test the server
        run: bun desktop/scripts/smoke.ts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wanheda-windows
          if-no-files-found: error
          # desktop/.out is a dot folder, which upload-artifact skips by default.
          include-hidden-files: true
          retention-days: 14
          path: |
            desktop/.out/*.exe
            desktop/.out/*.blockmap
            desktop/.out/latest.yml
            desktop/.out/SHA256SUMS.txt

  # Only for v* tags, after the build passed. Makes a DRAFT release and never
  # publishes it (V75): until a person does, nobody gets it.
  release:
    name: draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wanheda-windows
          path: release

      - name: Check every file against the build's checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Check the tag, take the notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${TAG#v}"
          pkg=$(jq -r .version package.json)
          if [ "$pkg" != "$version" ]; then
            echo "::error::tag $TAG doesn't match package.json version $pkg."
            exit 1
          fi
          # The version's section: from its heading to the next "## [".
          awk -v head="## [$version]" 'index($0, head) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no notes under ## [$version]."
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          # A re-run must not add a second draft. The lookup runs on its own
          # line so a failed `gh api` stops the step instead of reading as "none".
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [ -n "$existing" ]; then
            echo "::error::a release for $TAG already exists (it may be a draft). Delete it, then re-run this job."
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Wanheda ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" release/*
